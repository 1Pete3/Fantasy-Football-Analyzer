---
    name: pytest
    on: [push,pull_request]
    jobs:
        test:
            runs-on: ubuntu-latest
            steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.14.10"
                - name: Install Dependencies
                  run: |
                    python -m pip install --upgrade pip
                    pip install -e .
                    pip install --group dev
                - name: Run tests
                  run: pytest
                    
